name: Build Native Executables

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4

      - name: Build native exe
        run: gradle createDistributable

      - uses: actions/upload-artifact@v4
        with:
          name: nanogram-pc-windows
          path: build/compose/binaries/main/exe/*.exe

  build-macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4

      - name: Build native app
        run: gradle createDistributable

      - uses: actions/upload-artifact@v4
        with:
          name: nanogram-pc-macos
          path: build/compose/binaries/main/dmg/*.dmg

  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4

      - name: Build native app
        run: gradle createDistributable

      - uses: actions/upload-artifact@v4
        with:
          name: nanogram-pc-linux
          path: build/compose/binaries/main/deb/*.deb

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: release-files }
      - uses: softprops/action-gh-release@v2
        with:
          name: "Nanogram PC ${{ github.ref_name }}"
          files: release-files/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
