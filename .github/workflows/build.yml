name: Build Native Executables

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin' }

      - name: Install Gradle
        shell: pwsh
        run: |
          $url = "https://services.gradle.org/distributions/gradle-8.12-bin.zip"
          $zip = "$env:RUNNER_TEMP\gradle.zip"
          $dest = "$env:RUNNER_TEMP\gradle"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $gradleBin = Get-ChildItem -Path $dest -Directory | Select-Object -First 1
          echo "$($gradleBin.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build
        run: gradle createDistributable

      - name: Package artifact
        shell: pwsh
        run: |
          Get-ChildItem -Path build/compose/binaries/main -Recurse -Depth 3 | Select-Object FullName, Length
          echo "---"
          if (Test-Path build/compose/binaries/main/app) {
            Compress-Archive -Path build/compose/binaries/main/app -DestinationPath nanogram-pc-windows.zip
          } elseif (Test-Path build/compose/binaries/main/exe) {
            Compress-Archive -Path build/compose/binaries/main/exe -DestinationPath nanogram-pc-windows.zip
          } else {
            Compress-Archive -Path build/compose/binaries/main -DestinationPath nanogram-pc-windows.zip
          }

      - uses: actions/upload-artifact@v4
        with:
          name: nanogram-pc-windows
          path: nanogram-pc-windows.zip

  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin' }

      - name: Install Gradle & deps
        run: |
          sudo apt-get update && sudo apt-get install -y dpkg-dev fakeroot rpm
          curl -sL https://services.gradle.org/distributions/gradle-8.12-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.12/bin" >> $GITHUB_PATH

      - name: Build
        run: gradle createDistributable

      - name: List build output
        run: find build -type f | head -30

      - uses: actions/upload-artifact@v4
        with:
          name: nanogram-pc-linux
          path: |
            build/compose/binaries/**/*.deb
            build/compose/binaries/**/*.rpm
            build/compose/binaries/**/nanogram-pc*

  build-macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin' }

      - name: Install Gradle
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.12-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.12/bin" >> $GITHUB_PATH

      - name: Build
        run: gradle createDistributable

      - name: List build output
        run: find build -type f | head -30

      - uses: actions/upload-artifact@v4
        with:
          name: nanogram-pc-macos
          path: |
            build/compose/binaries/**/*.dmg
            build/compose/binaries/**/*.app/**

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: release-files }
      - uses: softprops/action-gh-release@v2
        with:
          name: "Nanogram PC ${{ github.ref_name }}"
          files: release-files/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
