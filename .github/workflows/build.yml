name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Keep CI builds lean; the release profile already tunes size.
  CARGO_INCREMENTAL: 0

jobs:
  # Fast feedback: typecheck the UI and compile-check Rust on one runner.
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux webview deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # tauri::generate_context! reads the bundle icons at compile time.
      - name: Generate app icons
        run: npx tauri icon src/assets/img/app_icon.png

      - name: Typecheck + build frontend
        run: npm run build

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

  bundle:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux webview deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev file desktop-file-utils

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Generate app icons
        run: npx tauri icon src/assets/img/app_icon.png

      - name: Build bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          base="src-tauri/target/${{ matrix.target }}/release/bundle"
          find "$base" -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \
               -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) \
            -exec cp {} out/ \; 2>/dev/null || true
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: nanogram-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  # Every green build on the default branch republishes the rolling "latest"
  # release, so the Releases tab always serves installers for the current
  # commit. Tagged pushes additionally cut a permanent versioned release.
  release:
    needs: bundle
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        shell: bash
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

      # A rolling tag cannot be moved in place, so replace it outright.
      - name: Reset rolling tag
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true

      - name: Publish latest build
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Latest build
          make_latest: true
          files: release/*
          body: |
            Automatic build of `${{ github.sha }}`.

            | Platform | File |
            |----------|------|
            | Windows 10/11 x64 | `.exe` installer or `.msi` |
            | macOS (Apple Silicon) | `.dmg` |
            | Linux x64 | `.deb` or `.AppImage` |

            Windows needs the Edge WebView2 runtime (preinstalled on Windows 11
            and Windows 10 21H2+). Linux needs `libwebkit2gtk-4.1`.
