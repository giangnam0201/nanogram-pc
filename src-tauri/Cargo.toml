[package]
name = "nanogram-pc"
version = "1.1.0"
description = "Nanogram for desktop"
authors = ["giangnam0201"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "nanogram_pc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "gzip",
    "brotli",
    "stream",
    "multipart",
] }
thiserror = "2"
base64 = "0.22"
url = "2"
rand = "0.8"
sha2 = "0.10"
log = "0.4"

[profile.release]
# Small, fast binary — this is a desktop app, not a server.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
